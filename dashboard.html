<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="theme-color" content="#07111f" />
    <title>Opening ArchFlow Knowledge Operator</title>
    <link rel="canonical" href="https://www.arch-flow.dev/project/dashboard/" />
    <style>
      :root { color-scheme: dark; background: #07111f; color: #f6f1e8; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(560px, 100%); padding: 28px; border: 1px solid rgba(246, 241, 232, 0.18); border-radius: 16px; background: #0c1b2d; }
      p { margin: 0; line-height: 1.6; }
      a { color: #efc88c; text-underline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p>Opening the ArchFlow Knowledge Operator. If the redirect does not start, <a href="project/dashboard/index.html" data-dashboard-target>open the dashboard</a>.</p>
    </main>
    <script>
      (function () {
        "use strict";
        var target = window.location.protocol === "file:" ? "project/dashboard/index.html" : "/project/dashboard/";
        document.querySelector("[data-dashboard-target]").setAttribute("href", target);
        window.location.replace(target);
      })();
    </script>
  </body>
</html>
