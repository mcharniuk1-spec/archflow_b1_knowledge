<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1586 992" role="img" aria-labelledby="title desc">
  <title id="title">ArchFlow output validation and receipt flow</title>
  <desc id="desc">Specialist candidate outputs enter one requirements and authority gate, then become a repair, approval wait, verified artifact, exact action receipt, or reviewed knowledge candidate.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17334a" flood-opacity=".14"/></filter>
    <style>
      .title{font:850 28px Inter,Arial,sans-serif;fill:#122838}.sub{font:500 14px Inter,Arial,sans-serif;fill:#52666f}
      .label{fill:#fffdf9;fill-opacity:.95;stroke:#cbd6dc;stroke-width:1.1;rx:10;filter:url(#shadow)}.head{font:850 11.5px Inter,Arial,sans-serif;fill:#122838}.copy{font:550 9px Inter,Arial,sans-serif;fill:#52666f}
      .gate{fill:#fff0eb;fill-opacity:.96;stroke:#d27962;stroke-width:1.4;rx:14;filter:url(#shadow)}.gatehead{font:900 12.5px Inter,Arial,sans-serif;fill:#9b4535}.gatecopy{font:600 9.2px Inter,Arial,sans-serif;fill:#784f47}
      .output{fill:#fff8e7;fill-opacity:.96;stroke:#c49b55;stroke-width:1.3;rx:12;filter:url(#shadow)}.outhead{font:850 11px Inter,Arial,sans-serif;fill:#795a28}.outcopy{font:550 8.8px Inter,Arial,sans-serif;fill:#695d49}
      .footer{fill:#122838;rx:13}.white{font:650 10.5px Inter,Arial,sans-serif;fill:#fff}
    </style>
  </defs>
  <image x="0" y="0" width="1586" height="992" xlink:href="output-receipt-flow-base.png"/>
  <rect x="38" y="28" width="1510" height="82" rx="18" fill="#fffdf9" fill-opacity=".92"/>
  <text class="title" x="60" y="63">Output flow — responsibility becomes evidence, not silent execution</text>
  <text class="sub" x="60" y="89">Every specialist delivers a candidate plus claim table and verification plan; LangGraph routes the case; requirements and independent review decide advancement.</text>

  <g>
    <rect class="label" x="54" y="146" width="215" height="74"/><text class="head" x="70" y="170">RESEARCH / REQUIREMENTS</text><text class="copy" x="70" y="190"><tspan x="70">Oksana · evidence cards · pain chain ·</tspan><tspan x="70" dy="14">versioned requirements · acceptance</tspan></text>
    <rect class="label" x="54" y="249" width="215" height="74"/><text class="head" x="70" y="273">TASK / HANDOFF</text><text class="copy" x="70" y="293"><tspan x="70">Danylo · dependencies · exact owner ·</tspan><tspan x="70" dy="14">files · checks · stop and rollback</tspan></text>
    <rect class="label" x="54" y="352" width="215" height="74"/><text class="head" x="70" y="376">OUTREACH / COPY</text><text class="copy" x="70" y="396"><tspan x="70">Andrii + Olena · qualification · claims ·</tspan><tspan x="70" dy="14">message candidate · no-send reason</tspan></text>
    <rect class="label" x="54" y="455" width="215" height="74"/><text class="head" x="70" y="479">DESIGN</text><text class="copy" x="70" y="499"><tspan x="70">Kateryna · hierarchy · editable source ·</tspan><tspan x="70" dy="14">responsive and accessibility evidence</tspan></text>
    <rect class="label" x="54" y="558" width="215" height="74"/><text class="head" x="70" y="582">IMPLEMENTATION</text><text class="copy" x="70" y="602"><tspan x="70">Dmytro · bounded patch · focused checks ·</tspan><tspan x="70" dy="14">known gaps · assigned repair only</tspan></text>
    <rect class="label" x="54" y="661" width="215" height="74"/><text class="head" x="70" y="685">REPORT / OUTCOME</text><text class="copy" x="70" y="705"><tspan x="70">Zoriana + Ostap · denominators · observed</tspan><tspan x="70" dy="14">vs modeled · decision-ready verdict</tspan></text>
  </g>

  <g>
    <rect class="gate" x="694" y="116" width="282" height="80"/>
    <text class="gatehead" x="835" y="142" text-anchor="middle">L6 · GRAPH CONTROL &amp; REVIEW</text>
    <text class="gatecopy" x="835" y="163" text-anchor="middle"><tspan x="835">typed state · append-only receipts · bounded repair</tspan><tspan x="835" dy="15">interrupt before private, external, or irreversible work</tspan></text>

    <rect class="gate" x="695" y="216" width="280" height="84"/>
    <text class="gatehead" x="835" y="242" text-anchor="middle">1 · REQUIREMENT COVERAGE</text>
    <text class="gatecopy" x="835" y="263" text-anchor="middle"><tspan x="835">current approved versions · non-goals · exceptions</tspan><tspan x="835" dy="15">material contradictions resolved or blocked</tspan></text>

    <rect class="gate" x="695" y="318" width="280" height="84"/>
    <text class="gatehead" x="835" y="344" text-anchor="middle">2 · AUTHORITY &amp; SIDE EFFECTS</text>
    <text class="gatecopy" x="835" y="365" text-anchor="middle"><tspan x="835">actor + exact target + operation + data class</tspan><tspan x="835" dy="15">approval, reversibility, and rollback must match</tspan></text>

    <rect class="gate" x="695" y="420" width="280" height="84"/>
    <text class="gatehead" x="835" y="446" text-anchor="middle">3 · MAKER CHECKS</text>
    <text class="gatecopy" x="835" y="467" text-anchor="middle"><tspan x="835">deterministic tests · claim/rights scan · visual QA</tspan><tspan x="835" dy="15">failure evidence becomes a bounded repair packet</tspan></text>

    <rect class="gate" x="695" y="522" width="280" height="84"/>
    <text class="gatehead" x="835" y="548" text-anchor="middle">4 · INDEPENDENT REVIEW</text>
    <text class="gatecopy" x="835" y="569" text-anchor="middle"><tspan x="835">Halyna freezes candidate: approve · revise · block</tspan><tspan x="835" dy="15">reviewer reports findings; maker performs repair</tspan></text>

    <rect class="gate" x="695" y="624" width="280" height="84"/>
    <text class="gatehead" x="835" y="650" text-anchor="middle">5 · ACTION + READBACK</text>
    <text class="gatecopy" x="835" y="671" text-anchor="middle"><tspan x="835">one approved action · action_id replay protection</tspan><tspan x="835" dy="15">read target state; never infer result from command success</tspan></text>

    <rect class="gate" x="695" y="726" width="280" height="84"/>
    <text class="gatehead" x="835" y="752" text-anchor="middle">6 · KNOWLEDGE PROMOTION</text>
    <text class="gatecopy" x="835" y="773" text-anchor="middle"><tspan x="835">Larysa searches duplicates and preserves lineage</tspan><tspan x="835" dy="15">promote reusable meaning, not raw trace or secrets</tspan></text>
  </g>

  <g>
    <rect class="output" x="1280" y="146" width="244" height="74"/><text class="outhead" x="1296" y="170">EMPLOYEE HANDOFF</text><text class="outcopy" x="1296" y="190"><tspan x="1296">next action · source · owner · reviewer ·</tspan><tspan x="1296" dy="14">stop condition · learning check</tspan></text>
    <rect class="output" x="1280" y="249" width="244" height="74"/><text class="outhead" x="1296" y="273">DECISION-READY REPORT</text><text class="outcopy" x="1296" y="293"><tspan x="1296">facts · interpretations · hypotheses · gaps ·</tspan><tspan x="1296" dy="14">pursue / pivot / stop recommendation</tspan></text>
    <rect class="output" x="1280" y="352" width="244" height="74"/><text class="outhead" x="1296" y="376">VERIFIED ARTIFACT</text><text class="outcopy" x="1296" y="396"><tspan x="1296">eligible candidate with requirement coverage,</tspan><tspan x="1296" dy="14">tests, reviewer verdict, and remaining gaps</tspan></text>
    <rect class="output" x="1280" y="455" width="244" height="74"/><text class="outhead" x="1296" y="479">ONE EXACT ACTION</text><text class="outcopy" x="1296" y="499"><tspan x="1296">only after target-specific owner approval;</tspan><tspan x="1296" dy="14">no chaining, no inferred permission</tspan></text>
    <rect class="output" x="1280" y="558" width="244" height="74"/><text class="outhead" x="1296" y="582">RESULT RECEIPT</text><text class="outcopy" x="1296" y="602"><tspan x="1296">action ID · exact target · observed result ·</tspan><tspan x="1296" dy="14">readback · rollback state · timestamp</tspan></text>
    <rect class="output" x="1280" y="661" width="244" height="74"/><text class="outhead" x="1296" y="685">MAINTAINED KNOWLEDGE</text><text class="outcopy" x="1296" y="705"><tspan x="1296">reviewed meaning · source lineage · owner ·</tspan><tspan x="1296" dy="14">freshness date · supersession link</tspan></text>
  </g>

  <rect class="footer" x="400" y="868" width="786" height="56"/>
  <text class="white" x="793" y="893" text-anchor="middle"><tspan x="793">Possible terminal states: verified · repair · approval wait · blocked · stopped · accepted result · closed without promotion.</tspan><tspan x="793" dy="17">A provider response, agent message, or successful command is never an execution or outcome receipt by itself.</tspan></text>
</svg>
