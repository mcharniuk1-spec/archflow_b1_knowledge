<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 2200 1120" role="img" aria-labelledby="title desc">
  <title id="title">ArchFlow responsive knowledge crew architecture</title>
  <desc id="desc">Seven labeled layers connect public and private-safe knowledge systems on the left to employee and business outputs on the right. Each connection states what it contributes and what remains gated.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17334a" flood-opacity=".12"/></filter>
    <style>
      .title{font:800 30px Inter,Arial,sans-serif;fill:#122838;letter-spacing:-.4px}.subtitle{font:500 15px Inter,Arial,sans-serif;fill:#52666f}
      .sidehead{font:800 13px Inter,Arial,sans-serif;fill:#315ecf;letter-spacing:1.4px}.box{fill:#fffdf9;stroke:#cbd6dc;stroke-width:1.4;rx:15;filter:url(#shadow)}
      .boxtitle{font:800 14px Inter,Arial,sans-serif;fill:#122838}.boxcopy{font:500 11px Inter,Arial,sans-serif;fill:#52666f}
      .layerbox{fill:#fffdf9;fill-opacity:.94;stroke-width:1.6;rx:13;filter:url(#shadow)}.layerid{font:900 12px Inter,Arial,sans-serif;fill:#fff}.layertitle{font:850 15px Inter,Arial,sans-serif;fill:#122838}.layercopy{font:600 10.5px Inter,Arial,sans-serif;fill:#4b5f68}
      .line{fill:none;stroke:#7696df;stroke-width:1.6;stroke-linecap:round}.rightline{fill:none;stroke:#d59668;stroke-width:1.6;stroke-linecap:round}.dot{fill:#315ecf}.rightdot{fill:#c17852}
      .foot{font:600 11px Inter,Arial,sans-serif;fill:#52666f}.capsule{fill:#122838;rx:12}.capsuletxt{font:750 11px Inter,Arial,sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="2200" height="1120" fill="#f7f0e7"/>
  <image x="307" y="64" width="1586" height="992" xlink:href="knowledge-crew-tower-base.png"/>

  <text class="title" x="48" y="48">One responsive knowledge crew — seven accountable layers</text>
  <text class="subtitle" x="48" y="75">Databases preserve source identity; roles own work; the graph controls state; requirements and reviewers control what may advance.</text>

  <text class="sidehead" x="32" y="118">KNOWLEDGE &amp; DATABASE SPINE</text>
  <text class="sidehead" x="1912" y="118">ACCOUNTABLE OUTPUTS</text>

  <g>
    <rect class="box" x="28" y="145" width="255" height="112"/>
    <text class="boxtitle" x="46" y="172">Public Git contracts</text>
    <text class="boxcopy" x="46" y="193"><tspan x="46">Schemas, roles, workflow packs,</tspan><tspan x="46" dy="16">examples, checks, and portable docs.</tspan><tspan x="46" dy="18">Authority: reviewed public contract.</tspan></text>
    <path class="line" d="M283 203 H410"/>
    <circle class="dot" cx="410" cy="203" r="4"/>

    <rect class="box" x="28" y="274" width="255" height="112"/>
    <text class="boxtitle" x="46" y="301">WikiLLM</text>
    <text class="boxcopy" x="46" y="322"><tspan x="46">Durable reviewed memory: indexes,</tspan><tspan x="46" dy="16">runs, decisions, issues, and lineage.</tspan><tspan x="46" dy="18">Never stores raw secrets or traces.</tspan></text>
    <path class="line" d="M283 332 H462"/>
    <circle class="dot" cx="462" cy="332" r="4"/>

    <rect class="box" x="28" y="403" width="255" height="112"/>
    <text class="boxtitle" x="46" y="430">Obsidian</text>
    <text class="boxcopy" x="46" y="451"><tspan x="46">Optional private human workspace</tspan><tspan x="46" dy="16">for semantic notes, maps, and review.</tspan><tspan x="46" dy="18">Plugins require trust and pinning.</tspan></text>
    <path class="line" d="M283 461 H430"/>
    <circle class="dot" cx="430" cy="461" r="4"/>

    <rect class="box" x="28" y="532" width="255" height="112"/>
    <text class="boxtitle" x="46" y="559">LlamaIndex</text>
    <text class="boxcopy" x="46" y="580"><tspan x="46">Allowlisted documents and nodes,</tspan><tspan x="46" dy="16">metadata filters, hybrid retrieval.</tspan><tspan x="46" dy="18">800/120 chunks · top-k 5/5/5.</tspan></text>
    <path class="line" d="M283 590 H445"/>
    <circle class="dot" cx="445" cy="590" r="4"/>

    <rect class="box" x="28" y="661" width="255" height="112"/>
    <text class="boxtitle" x="46" y="688">TurboVec candidate</text>
    <text class="boxcopy" x="46" y="709"><tspan x="46">Optional 4-bit vector candidate</tspan><tspan x="46" dy="16">behind LlamaIndex; never authority.</tspan><tspan x="46" dy="18">20-query gate · lexical fallback.</tspan></text>
    <path class="line" d="M283 719 H485"/>
    <circle class="dot" cx="485" cy="719" r="4"/>

    <rect class="box" x="28" y="790" width="255" height="112"/>
    <text class="boxtitle" x="46" y="817">Orbit + Graphify</text>
    <text class="boxcopy" x="46" y="838"><tspan x="46">Structural definitions, references,</tspan><tspan x="46" dy="16">paths, and likely blast radius.</tspan><tspan x="46" dy="18">Always followed by exact file reads.</tspan></text>
    <path class="line" d="M283 848 H496"/>
    <circle class="dot" cx="496" cy="848" r="4"/>

    <rect class="box" x="28" y="919" width="255" height="112"/>
    <text class="boxtitle" x="46" y="946">State persistence</text>
    <text class="boxcopy" x="46" y="967"><tspan x="46">Public: none. Local: SQLite after</tspan><tspan x="46" dy="16">proof. Team: PostgreSQL after</tspan><tspan x="46" dy="18">tenancy, backup, recovery proof.</tspan></text>
    <path class="line" d="M283 977 H610"/>
    <circle class="dot" cx="610" cy="977" r="4"/>
  </g>

  <!-- Labels sit in the intentionally enlarged gaps between the generated tower planes. -->
  <g>
    <rect class="layerbox" x="740" y="238" width="690" height="61" stroke="#315ecf"/>
    <rect x="754" y="249" width="38" height="38" rx="11" fill="#315ecf"/><text class="layerid" x="773" y="273" text-anchor="middle">L1</text>
    <text class="layertitle" x="807" y="260">CASE AUTHORITY &amp; EMPLOYEE SCOPE</text>
    <text class="layercopy" x="807" y="280">Goal · role · permission · risk · reviewer · done and stop conditions</text>

    <rect class="layerbox" x="740" y="330" width="690" height="61" stroke="#4867cf"/>
    <rect x="754" y="341" width="38" height="38" rx="11" fill="#4867cf"/><text class="layerid" x="773" y="365" text-anchor="middle">L2</text>
    <text class="layertitle" x="807" y="352">REVIEWED KNOWLEDGE &amp; SOURCE SPINE</text>
    <text class="layercopy" x="807" y="372">WikiLLM · Obsidian · source authority · owner · freshness · allowlist</text>

    <rect class="layerbox" x="740" y="422" width="690" height="61" stroke="#625acb"/>
    <rect x="754" y="433" width="38" height="38" rx="11" fill="#625acb"/><text class="layerid" x="773" y="457" text-anchor="middle">L3</text>
    <text class="layertitle" x="807" y="444">BOUNDED CONTEXT PERCEPTION</text>
    <text class="layercopy" x="807" y="464">CAG + LlamaIndex + optional TurboVec + structure + exact source reads</text>

    <rect class="layerbox" x="740" y="514" width="690" height="61" stroke="#7558bf"/>
    <rect x="754" y="525" width="38" height="38" rx="11" fill="#7558bf"/><text class="layerid" x="773" y="549" text-anchor="middle">L4</text>
    <text class="layertitle" x="807" y="536">ADAPTIVE ROLE CREW</text>
    <text class="layercopy" x="807" y="556">CrewAI-compatible contracts · smallest responsible team · bounded handoffs</text>

    <rect class="layerbox" x="740" y="606" width="690" height="61" stroke="#8a64b7"/>
    <rect x="754" y="617" width="38" height="38" rx="11" fill="#8a64b7"/><text class="layerid" x="773" y="641" text-anchor="middle">L5</text>
    <text class="layertitle" x="807" y="628">SPECIALIST RESEARCH &amp; DELIVERY</text>
    <text class="layercopy" x="807" y="648">Onboarding · requirements · outreach · copy · design · code · reporting</text>

    <rect class="layerbox" x="740" y="698" width="690" height="61" stroke="#cc735d"/>
    <rect x="754" y="709" width="38" height="38" rx="11" fill="#cc735d"/><text class="layerid" x="773" y="733" text-anchor="middle">L6</text>
    <text class="layertitle" x="807" y="720">GRAPH CONTROL, VALIDATION &amp; REVIEW</text>
    <text class="layercopy" x="807" y="740">LangGraph state · reducers · checkpoints · interrupts · repair · readback</text>

    <rect class="layerbox" x="740" y="790" width="690" height="61" stroke="#b1843f"/>
    <rect x="754" y="801" width="38" height="38" rx="11" fill="#b1843f"/><text class="layerid" x="773" y="825" text-anchor="middle">L7</text>
    <text class="layertitle" x="807" y="812">RECEIPTS, OUTCOMES &amp; MAINTAINED KNOWLEDGE</text>
    <text class="layercopy" x="807" y="832">Exact result · employee learning · promotion candidate · lineage · freshness</text>
  </g>

  <g>
    <rect class="box" x="1913" y="145" width="259" height="112"/>
    <text class="boxtitle" x="1931" y="172">Admitted case</text>
    <text class="boxcopy" x="1931" y="193"><tspan x="1931">A bounded mission with explicit</tspan><tspan x="1931" dy="16">authority, risk, reviewer, and stop.</tspan><tspan x="1931" dy="18">Efficiency: no work before scope.</tspan></text>
    <path class="rightline" d="M1790 203 H1913"/><circle class="rightdot" cx="1790" cy="203" r="4"/>

    <rect class="box" x="1913" y="274" width="259" height="112"/>
    <text class="boxtitle" x="1931" y="301">Source and freshness map</text>
    <text class="boxcopy" x="1931" y="322"><tspan x="1931">Current, stale, superseded, private,</tspan><tspan x="1931" dy="16">or prohibited—with owner and date.</tspan><tspan x="1931" dy="18">Efficiency: fewer false answers.</tspan></text>
    <path class="rightline" d="M1758 332 H1913"/><circle class="rightdot" cx="1758" cy="332" r="4"/>

    <rect class="box" x="1913" y="403" width="259" height="112"/>
    <text class="boxtitle" x="1931" y="430">Perception capsule</text>
    <text class="boxcopy" x="1931" y="451"><tspan x="1931">12k-token, role-safe, source-visible</tspan><tspan x="1931" dy="16">context with contradictions and gaps.</tspan><tspan x="1931" dy="18">Efficiency: compress, retain lineage.</tspan></text>
    <path class="rightline" d="M1778 461 H1913"/><circle class="rightdot" cx="1778" cy="461" r="4"/>

    <rect class="box" x="1913" y="532" width="259" height="112"/>
    <text class="boxtitle" x="1931" y="559">Role and handoff plan</text>
    <text class="boxcopy" x="1931" y="580"><tspan x="1931">One owner per output; different</tspan><tspan x="1931" dy="16">reviewer; exact skills, tools, files.</tspan><tspan x="1931" dy="18">Efficiency: elastic, no role sprawl.</tspan></text>
    <path class="rightline" d="M1763 590 H1913"/><circle class="rightdot" cx="1763" cy="590" r="4"/>

    <rect class="box" x="1913" y="661" width="259" height="112"/>
    <text class="boxtitle" x="1931" y="688">Reviewable artifact</text>
    <text class="boxcopy" x="1931" y="709"><tspan x="1931">Research, task, message, design,</tspan><tspan x="1931" dy="16">implementation, or report candidate.</tspan><tspan x="1931" dy="18">Efficiency: shared acceptance checks.</tspan></text>
    <path class="rightline" d="M1788 719 H1913"/><circle class="rightdot" cx="1788" cy="719" r="4"/>

    <rect class="box" x="1913" y="790" width="259" height="112"/>
    <text class="boxtitle" x="1931" y="817">Verdict or approval wait</text>
    <text class="boxcopy" x="1931" y="838"><tspan x="1931">Eligible, repair, blocked, verified,</tspan><tspan x="1931" dy="16">or exact owner interrupt.</tspan><tspan x="1931" dy="18">Efficiency: fail closed, resume safely.</tspan></text>
    <path class="rightline" d="M1760 848 H1913"/><circle class="rightdot" cx="1760" cy="848" r="4"/>

    <rect class="box" x="1913" y="919" width="259" height="112"/>
    <text class="boxtitle" x="1931" y="946">Handoff and learning</text>
    <text class="boxcopy" x="1931" y="967"><tspan x="1931">Exact receipt, readback, outcome,</tspan><tspan x="1931" dy="16">promotion candidate, freshness task.</tspan><tspan x="1931" dy="18">Efficiency: each run improves reuse.</tspan></text>
    <path class="rightline" d="M1768 977 H1913"/><circle class="rightdot" cx="1768" cy="977" r="4"/>
  </g>

  <rect class="capsule" x="775" y="1039" width="650" height="38"/>
  <text class="capsuletxt" x="1100" y="1063" text-anchor="middle">Provider-disabled public default · no autonomous writeback · exact owner approval remains target-specific</text>
  <text class="foot" x="48" y="1092">Portable core: Git + WikiLLM + deterministic contracts. Optional local capabilities never copy private vault data into the public repository.</text>
</svg>
