<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Employee onboarding and action validation flow</title>
  <desc id="desc">A left-to-right sequence from employee question through role boundary, current knowledge, proposed action, requirement validation, independent review, approval when needed, execution receipt, and knowledge promotion.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09131c"/><stop offset="1" stop-color="#17242b"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#e0ad56"/></marker>
    <pattern id="grid2" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#314650" opacity=".3"/></pattern>
  </defs>
  <rect width="1440" height="760" fill="url(#bg2)"/><rect width="1440" height="760" fill="url(#grid2)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="75" y="74" fill="#f4eddf" font-size="34" font-weight="700">ONBOARDING THAT STOPS BEFORE A BAD ACTION</text>
    <text x="75" y="110" fill="#aebfc6" font-size="18">The agent explains current knowledge, proposes work, and validates it against reviewed requirements.</text>
    <path d="M150 338H1275" stroke="#e0ad56" stroke-width="4" marker-end="url(#arrow)"/>
    <g fill="#101f28" stroke="#d6a14e" stroke-width="2">
      <rect x="60" y="256" width="170" height="164" rx="18"/><rect x="260" y="256" width="170" height="164" rx="18"/>
      <rect x="460" y="256" width="170" height="164" rx="18"/><rect x="660" y="256" width="170" height="164" rx="18"/>
      <rect x="860" y="256" width="170" height="164" rx="18"/><rect x="1060" y="256" width="170" height="164" rx="18"/>
      <rect x="1260" y="256" width="120" height="164" rx="18"/>
    </g>
    <g fill="#f4eddf" font-size="18" font-weight="700" text-anchor="middle">
      <text x="145" y="292">QUESTION</text><text x="345" y="292">ROLE BOUNDARY</text><text x="545" y="292">CURRENT TRUTH</text>
      <text x="745" y="292">PROPOSAL</text><text x="945" y="292">VALIDATION</text><text x="1145" y="292">REVIEW / GATE</text>
      <text x="1320" y="292">RESULT</text>
    </g>
    <g fill="#b9c9cf" font-size="14" text-anchor="middle">
      <text x="145" y="330">What should I do?</text><text x="145" y="355">Which decision?</text><text x="145" y="380">What is unclear?</text>
      <text x="345" y="330">Allowed sources</text><text x="345" y="355">Allowed actions</text><text x="345" y="380">Manager / reviewer</text>
      <text x="545" y="330">Requirement</text><text x="545" y="355">Source · owner · date</text><text x="545" y="380">Conflict · rationale</text>
      <text x="745" y="330">Exact target</text><text x="745" y="355">Change and effect</text><text x="745" y="380">Rollback · readback</text>
      <text x="945" y="330">Coverage</text><text x="945" y="355">Permission · safety</text><text x="945" y="380">Currentness</text>
      <text x="1145" y="330">Independent verdict</text><text x="1145" y="355">Exact approval</text><text x="1145" y="380">Repair or stop</text>
      <text x="1320" y="330">Receipt</text><text x="1320" y="355">Readback</text><text x="1320" y="380">Promote?</text>
    </g>
    <path d="M945 420V470H650V506" fill="none" stroke="#cc694c" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="555" y="506" width="190" height="72" rx="14" fill="#321f1d" stroke="#cc694c" stroke-width="2"/>
    <text x="650" y="536" fill="#f4eddf" font-size="17" font-weight="700" text-anchor="middle">REPAIR · ESCALATE</text>
    <text x="650" y="558" fill="#d5b5ac" font-size="13" text-anchor="middle">or block with exact reason</text>
    <path d="M1320 420V526H1110" fill="none" stroke="#4ca6a0" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="890" y="506" width="220" height="72" rx="14" fill="#12322d" stroke="#4ca6a0" stroke-width="2"/>
    <text x="1000" y="536" fill="#f4eddf" font-size="17" font-weight="700" text-anchor="middle">REVIEWED KNOWLEDGE</text>
    <text x="1000" y="558" fill="#abd3cd" font-size="13" text-anchor="middle">only if reusable and accepted</text>
    <g transform="translate(70 636)">
      <circle cx="10" cy="0" r="7" fill="#e0ad56"/><text x="30" y="6" fill="#c4d0d5" font-size="15">Evidence supports understanding.</text>
      <circle cx="312" cy="0" r="7" fill="#4ca6a0"/><text x="332" y="6" fill="#c4d0d5" font-size="15">Review supports acceptance.</text>
      <circle cx="590" cy="0" r="7" fill="#cc694c"/><text x="610" y="6" fill="#c4d0d5" font-size="15">Approval supports one exact high-risk action.</text>
    </g>
  </g>
</svg>
