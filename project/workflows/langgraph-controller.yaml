name: archflow_knowledge_case_controller
status: provider_disabled_contract_and_deterministic_fixture
runtime: langgraph_python
purpose: >
  Own the typed lifecycle of one employee or delivery case: admission,
  context, requirements, adaptive roles, specialist work, validation,
  approval interrupts, verification, receipts, and reviewed knowledge.
  LangGraph controls transitions; it does not create knowledge authority.

canonical_operating_model: project/system/contracts/operating-model.json
canonical_case_schema: project/system/schemas/knowledge-case.schema.json
canonical_crew: project/system/contracts/knowledge-crew-config.json

state_schema:
  schema_version: string
  case_version: string
  case_id: string
  workflow_state: string
  display_phase: orient_perceive_commit_work_gate_or_learn
  goal: object
  authority: object
  source_boundary: object
  evidence: append_unique_list
  claims: append_unique_list
  requirements: versioned_list
  decisions: versioned_list
  contradictions: append_unique_list
  gaps: append_unique_list
  tasks: versioned_list
  artifacts: append_unique_list
  approvals: append_only_list
  results: append_only_list
  receipts: append_only_list
  repair_attempts: integer

reducers:
  evidence: append_unique_by_id
  claims: append_unique_by_id
  contradictions: append_unique_by_id
  gaps: append_unique_by_id
  artifacts: append_unique_by_id
  approvals: append_only
  results: append_only
  receipts: append_only
  requirements: replace_same_id_only_with_higher_version
  decisions: replace_same_id_only_with_higher_version
  tasks: replace_same_id_only_after_valid_transition
  workflow_state: replace_after_valid_transition

nodes:
  admit_case:
    owner_agent: admission_controller
    purpose: validate goal, role, source boundary, risk, permission, done, reviewer, and stop rules
    output: admitted_case_or_gap
  assemble_perception:
    owner_agent: source_and_context_operator
    purpose: combine stable CAG, bounded LlamaIndex retrieval, optional TurboVec candidates, structure, and exact reads
    output: context_capsule_with_sources_contradictions_and_gaps
  research_requirements:
    owner_agent: requirements_and_market_research
    purpose: produce evidence-linked requirement candidates, decisions, non-goals, and acceptance checks
    output: requirement_review_packet
  requirement_owner_gate:
    owner_agent: goal_and_architecture_operator
    purpose: interrupt for the accountable requirement owner to approve, reject, or request revision
    output: approved_requirement_versions_or_interrupt
  plan_role_work:
    owner_agent: task_and_handoff_planner
    purpose: select the smallest workflow pack and bind role-safe task and handoff contracts
    output: bounded_tasks_and_crew_plan
  specialist_work:
    owner_agent: selected_role_owner
    purpose: create the assigned candidate without expanding authority
    output: candidate_artifact_claim_table_and_verification_plan
  validate_action:
    owner_agent: action_validator
    purpose: evaluate requirement coverage, permission, side effects, reversibility, rollback, verification, and readback
    output: eligible_repair_approval_wait_or_blocked
  deterministic_verify:
    owner_agent: verifier
    purpose: run specified checks and report exact failures without silently repairing
    output: verification_receipt
  independent_review:
    owner_agent: independent_reviewer
    purpose: review the frozen candidate and issue approve, revise, or block
    output: independent_review_receipt
  approval_interrupt:
    owner_agent: accountable_owner
    purpose: pause before a private, external, irreversible, or high-risk action
    output: target_specific_approval_or_rejection
  execute_one_action:
    owner_agent: external_action_operator
    purpose: perform one exact approved action with action_id replay protection
    output: action_receipt
  readback_result:
    owner_agent: verifier
    purpose: inspect the exact target state and compare it with the accepted result criteria
    output: readback_receipt_and_result
  promotion_review:
    owner_agent: knowledge_librarian
    purpose: search duplicates and propose reusable meaning with lineage, supersession, owner, and freshness
    output: promoted_rejected_or_no_promotion_receipt
  close_case:
    owner_agent: integrator
    purpose: ensure terminal state, exact receipts, remaining gaps, and employee/owner handoff are recorded
    output: closed_case_handoff

edges:
  - from: START
    to: admit_case
  - from: admit_case
    to: assemble_perception
    condition: admission_passed
  - from: admit_case
    to: close_case
    condition: blocked_or_stopped
  - from: assemble_perception
    to: research_requirements
    condition: evidence_sufficient_or_research_required
  - from: assemble_perception
    to: plan_role_work
    condition: current_requirements_already_approved
  - from: research_requirements
    to: requirement_owner_gate
  - from: requirement_owner_gate
    to: plan_role_work
    condition: requirements_approved
  - from: requirement_owner_gate
    to: research_requirements
    condition: revise
  - from: plan_role_work
    to: specialist_work
  - from: specialist_work
    to: validate_action
  - from: validate_action
    to: deterministic_verify
    condition: eligible
  - from: validate_action
    to: specialist_work
    condition: repair_and_attempts_remaining
  - from: validate_action
    to: approval_interrupt
    condition: exact_owner_approval_required
  - from: validate_action
    to: close_case
    condition: blocked_or_stopped
  - from: deterministic_verify
    to: independent_review
    condition: pass
  - from: deterministic_verify
    to: specialist_work
    condition: repair_and_attempts_remaining
  - from: independent_review
    to: specialist_work
    condition: revise_and_attempts_remaining
  - from: independent_review
    to: approval_interrupt
    condition: approved_and_external_or_high_risk
  - from: independent_review
    to: readback_result
    condition: approved_local_no_action
  - from: approval_interrupt
    to: execute_one_action
    condition: target_specific_approval
  - from: approval_interrupt
    to: close_case
    condition: rejected_expired_or_scope_changed
  - from: execute_one_action
    to: readback_result
  - from: readback_result
    to: promotion_review
    condition: accepted_result
  - from: readback_result
    to: specialist_work
    condition: repair_is_authorized_and_reversible
  - from: promotion_review
    to: close_case
  - from: close_case
    to: END

current_parameters:
  provider_runtime: disabled
  public_checkpointer: none
  local_single_user_checkpointer: sqlite_after_migration_and_recovery_proof
  team_checkpointer: postgresql_after_tenancy_backup_and_recovery_proof
  thread_id: case_id
  subgraph_persistence: per_invocation_by_default
  maximum_repair_attempts: 3
  maximum_same_failure: 2
  maker_can_be_final_reviewer: false
  side_effect_position: after_interrupt_only
  side_effect_idempotency: action_id_replay_protection
  interrupt_payload: json_serializable_summary_without_secrets
  provider_calls: 0
  writeback: 0

interrupts:
  - requirement_owner_decision
  - external_action_approval
  - private_source_request
  - irreversible_change
  - material_contradiction

terminal_rule: no_success_state_without_required_receipt_and_exact_readback
official_primary_sources:
  - https://docs.langchain.com/oss/python/langgraph/overview
  - https://docs.langchain.com/oss/python/langgraph/persistence
  - https://docs.langchain.com/oss/python/langgraph/interrupts
  - https://docs.langchain.com/oss/python/langgraph/use-subgraphs
