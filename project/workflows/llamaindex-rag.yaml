name: archflow_responsive_context_perception
status: provider_disabled_public_contract_with_optional_local_runtime
runtime: llamaindex_python
purpose: >
  Build a bounded, source-visible context capsule for one admitted case.
  LlamaIndex owns allowlisted loading, document/node identity, metadata
  filtering, retrieval routing, ranking, and source-node return. It never
  owns knowledge truth, requirements, permission, approval, or promotion.

canonical_contract: project/system/contracts/knowledge-crew-config.json
case_schema: project/system/schemas/knowledge-case.schema.json
context_capsule_schema: project/context/context-capsule.schema.json
source_boundary_policy: project/context/retrieval/source-boundary-policy.yaml

context_method:
  stable_cag:
    job: reuse project identity, architecture, safety, role responsibility, and source rules
    budget_tokens: 2400
  task_rag:
    job: retrieve only evidence relevant to the current role, task, requirement, and decision
    authority: candidate_evidence_only
  exact_read:
    job: open the exact source before a material claim or action can advance
    required_for_action: true
  compression:
    rule: compress summaries_never_provenance_or_current_requirements
    maximum_capsule_tokens: 12000

approved_corpus:
  include:
    - project/
    - skills/
    - wiki/
    - history/summary-only/
  exclude:
    - .git/
    - private/
    - secrets/
    - raw/
    - source_exports/
    - project/local/
    - project/.env.local
    - tmp/

document_identity:
  document:
    - doc_id
    - document_hash
    - source_path
  node:
    - chunk_id
    - ref_doc_id
  deduplicate_by:
    - doc_id
    - document_hash

indexing_parameters:
  loader: allowlisted_file_reader
  document_language: english
  chunk_size: 800
  chunk_overlap: 120
  metadata_fields:
    - source_path
    - document_type
    - public_safety_status
    - authority_state
    - updated_at
    - owner
    - review_by
    - superseded_by
  transformation_cache: ignored_local_runtime
  persist_dir: project/local/rag_index
  persist_dir_git_status: ignored

retrieval_parameters:
  query_engine: adaptive_allowlisted_hybrid
  query_mode: adaptive_hybrid
  lexical_top_k: 5
  vector_top_k: 5
  rerank_top_k: 5
  final_source_limit: 8
  require_source_paths: true
  require_exact_read_for_action: true
  refuse_private_match: true
  fallback_to_lexical: true
  canonical_source_boost: true
  superseded_source_penalty: true
  contradictory_current_claim: return_gap_and_request_reconciliation
  no_source_path_means_no_evidence: true

vector_candidate:
  adapter: turbovec_llamaindex_vector_store
  mode: optional_when_available_and_benchmark_eligible
  current_verdict: optional_trial_not_default
  version_evidence: "0.8.0"
  bit_width: 4
  embedding_dimension: must_match_pinned_embedder
  id_strategy: stable_uint64_sidecar_to_doc_and_chunk_ids
  allowlist_filter: required
  persistence: binary_index_plus_node_sidecar_moved_atomically
  known_limit: no_native_mmr_or_hybrid_after_full_precision_vectors_are_discarded
  fallback: deterministic_lexical
  isolated_evidence:
    public_receipt: project/reports/20260713-secured-runtime-architecture-report.md
    queries: 10
    checks: 9_of_9_passed
    candidate_recall_at_3: 1.0
    candidate_mrr: 0.8167
    lexical_baseline: not_published_in_public_receipt
    verdict: optional_trial_not_default
    interpretation: promising_small_synthetic_fixture_not_production_proof
  promotion_gate:
    fixed_query_count: 20
    minimum_recall_at_k: 0.70
    no_regression_against_lexical: true
    citation_retention: 1.0
    metadata_filter_pass: true
    persistence_reload_parity: true
    independent_review: true

structural_evidence:
  orbit:
    status: optional_private_local_adapter
    job: definitions_references_paths_and_entry_points_for_one_allowlisted_corpus
  graphify:
    status: generated_reference
    job: repository_relationships_and_likely_blast_radius
  rule: generated_structure_must_be_followed_by_exact_file_reads

outputs:
  retrieval_log: project/outputs/templates/retrieval-log.md
  source_inventory: project/outputs/templates/source-inventory.md
  context_digest: project/outputs/templates/context-digest.md
  context_capsule: project/context/capsules/<run-id>.json
  local_index: project/local/rag_index

fail_closed_when:
  - source_boundary_is_missing_or_invalid
  - private_or_prohibited_source_matches
  - current_and_superseded_claims_conflict
  - exact_source_cannot_be_read_for_action
  - required_metadata_or_source_path_is_missing
  - context_budget_would_drop_current_requirements

official_primary_sources:
  - https://docs.llamaindex.ai/en/v0.10.17/module_guides/loading/ingestion_pipeline/root.html
  - https://docs.llamaindex.ai/en/v0.10.19/module_guides/loading/documents_and_nodes/root.html
  - https://docs.llamaindex.ai/en/stable/api_reference/retrievers/router/
  - https://github.com/RyanCodrai/turbovec
