name: archflow_adaptive_role_crew
status: provider_disabled_role_and_task_contract
runtime: crewai_python
purpose: >
  Express the smallest responsible crew for one admitted case. CrewAI
  structures role, goal, task, allowed knowledge, tool boundary, expected
  output, delegation, reviewer, and handoff. It does not own case state,
  knowledge truth, permission, approval, durable memory, or external action.

canonical_role_catalog: project/system/contracts/role-catalog.json
canonical_workflow_packs: project/system/contracts/role-workflows.json
canonical_case_controller: project/system/contracts/operating-model.json

process: sequential
memory: false
cache: true
planning: false
delegation_default: false
maximum_parallel_tasks: 3
knowledge_input: role_safe_perception_capsule_only
manager: Maksym
provider_execution: disabled
output_log_file: project/local/crew/crew-log.json
storage_boundary: project/local/crew
telemetry_for_guard_runs: disabled

selection_rule: >
  Start with the smallest workflow pack. Add a role only when it owns a
  required output, deterministic check, approval review, or handoff.
  A role binding never expands the case authority.
task_materialization: project/system/schemas/role-task-binding.schema.json
task_template_rule: >
  Entries under tasks are provider-disabled templates only. A runnable task is
  materialized from one schema-valid role_task_binding whose authority is the
  intersection of case authority, the role ceiling, runtime capabilities,
  exact targets, and denials.

agents:
  goal_and_architecture_operator:
    call_name: Yaromyr
    role: Goal and Architecture Operator
    goal: Bind the objective, done conditions, state design, and gate contract without expanding authority.
  admission_controller:
    call_name: Bohdan
    role: Admission Controller
    goal: Classify risk, select the approved profile and minimum roles, and stop work that fails admission.
  source_and_context_operator:
    call_name: Solomiia
    role: Source and Context Operator
    goal: Build the allowlist, stable CAG context, bounded retrieval plan, and source-visible perception capsule.
  requirements_and_market_research:
    call_name: Oksana
    role: Requirements and Market Research
    goal: Turn reviewed evidence into requirement candidates, market boundaries, disconfirmation, and acceptance checks.
  onboarding_guide:
    call_name: Taras
    role: Onboarding Guide
    goal: Give an employee role-safe context, explain why the work matters, and propose a validated first action.
  task_and_handoff_planner:
    call_name: Danylo
    role: Task and Handoff Planner
    goal: Create dependencies, bounded task packets, exact checks, stop rules, and owner questions.
  positioning_and_copy_maker:
    call_name: Olena
    role: Positioning and Copy Maker
    goal: Create evidence-linked copy, positioning, and claim tables without sending or publishing.
  qualification_and_channel_planner:
    call_name: Andrii
    role: Qualification and Channel Planner
    goal: Separate company fit, person currentness, stage, channel, and exact-send readiness.
  designer:
    call_name: Kateryna
    role: Designer
    goal: Make editable, responsive, accessible visuals or interfaces from approved content and exact target constraints.
  implementation_maker:
    call_name: Dmytro
    role: Implementation Maker
    goal: Change only claimed files and produce focused checks, rollback evidence, and assigned repairs.
  action_validator:
    call_name: Iryna
    role: Action Validator
    goal: Check requirements, permission, side effects, rollback, verification, and readback before execution.
  verifier:
    call_name: Mykola
    role: Verifier
    goal: Run deterministic checks and produce reproducible regression and exact-readback evidence.
  independent_reviewer:
    call_name: Halyna
    role: Independent Reviewer
    goal: Approve, revise, or block a frozen candidate with calibrated claims and exact repair requests.
  knowledge_librarian:
    call_name: Larysa
    role: Knowledge Librarian
    goal: Search duplicates and propose lineage, supersession, freshness, and retrieval-safe knowledge promotion.
  integrator:
    call_name: Maksym
    role: Integrator
    goal: Register lanes, resolve conflicts, merge approved work in order, and deliver final receipts and handoff.
  external_action_operator:
    call_name: Pavlo
    role: External Action Operator
    goal: Perform one exact approved external action with preflight, idempotency, receipt, and readback.
  release_operator:
    call_name: Nazar
    role: Release Operator
    goal: Prepare a release and perform only an exact owner-approved Git action with proof and readback.
  growth_and_outcome_analyst:
    call_name: Zoriana
    role: Growth and Outcome Analyst
    goal: Preserve event denominators and separate observed outcomes from modeled recommendations.
  observability_and_efficiency_observer:
    call_name: Ostap
    role: Observability and Efficiency Observer
    goal: Report runtime drift, usage evidence, and reproducibility gaps without activating or mutating the runtime.
  surface_projection_operator:
    call_name: Marta
    role: Surface Projection Operator
    goal: Project truthful read-only state and export browser-local review packets without becoming a source of truth.
  product_packaging_engineer:
    call_name: Roman
    role: Product Packaging Engineer
    goal: Prove clean-clone setup, least privilege, upgrade, uninstall, and rollback for a portable package.

tasks:
  - id: orient_case
    agent: goal_and_architecture_operator
    expected_output: admitted_case_candidate
  - id: classify_admission
    agent: admission_controller
    expected_output: risk_profile_roles_and_stop_rules
  - id: assemble_perception
    agent: source_and_context_operator
    expected_output: source_visible_context_capsule
  - id: research_requirements
    agent: requirements_and_market_research
    expected_output: evidence_claim_and_requirement_packet
  - id: plan_work
    agent: task_and_handoff_planner
    expected_output: bounded_mission_and_handoff_packet
  - id: support_employee
    agent: onboarding_guide
    expected_output: role_projection_first_mission_and_escalation
  - id: make_candidate
    agent: implementation_maker
    expected_output: reviewable_candidate_with_checks
  - id: validate_action
    agent: action_validator
    expected_output: eligible_repair_approval_wait_or_blocked_verdict
  - id: verify_result
    agent: verifier
    expected_output: deterministic_verification_and_readback
  - id: review_candidate
    agent: independent_reviewer
    expected_output: approve_revise_or_block_verdict
  - id: integrate_case
    agent: integrator
    expected_output: merged_artifacts_receipts_and_handoff
  - id: propose_knowledge
    agent: knowledge_librarian
    expected_output: promotion_candidate_with_lineage_and_freshness
  - id: prepare_surface
    agent: surface_projection_operator
    expected_output: browser_local_review_projection
  - id: prepare_release
    agent: release_operator
    expected_output: release_preflight_and_owner_approval_packet

task_contract_required:
  - binding_id
  - case_id
  - workflow_pack_id
  - base_or_closure
  - role_id
  - call_name
  - role_goal
  - inputs
  - owned_output
  - source_refs
  - requirement_refs
  - allowed_skills
  - allowed_tools
  - permission_boundary
  - forbidden_actions
  - exact_targets
  - expected_output
  - deterministic_checks
  - known_gaps
  - reviewer_route
  - handoff
  - stop_conditions

official_primary_source:
  - https://docs.crewai.com/
