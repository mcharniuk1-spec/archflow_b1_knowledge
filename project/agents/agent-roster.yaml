    lane: maker
    permission_mode: read_draft_only
    skill_packages: [archflow-knowledge-service]
    role_pack_ids: []
    handoff_to: action_validator

  designer:
    title: Designer
    lane: maker
    permission_mode: local_mutation_exact_targets
    skill_packages: []
    role_pack_ids: []
    handoff_to: verifier

  implementation_maker:
    title: Implementation Maker
    lane: maker
    permission_mode: local_mutation_exact_targets
    skill_packages: [arcagcom]
    role_pack_ids: [responsive_product_change]
    handoff_to: action_validator

  action_validator:
    title: Action Validator
    lane: validator
    permission_mode: review_only_frozen_candidate
    skill_packages: [archflow-agent-control, outquestions]
    role_pack_ids: [definition_to_task_graph]
