selection:
  rule: activate_the_smallest_role_pack_or_custom_role_set_that_covers_ownership_review_and_integration
  individual: one_operator_may_coordinate_multiple_contracts_but_not_self_approve_high_risk_work
  team: assign_one_writer_per_shared_target_and_version_each_handoff
