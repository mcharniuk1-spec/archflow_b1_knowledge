schema_version: "3.0"
status: canonical_role_projection
catalog_source: project/system/contracts/role-catalog.json
role_pack_source: project/agents/actionable-role-packs.json

authority:
  rule: role_assignment_does_not_grant_authority
  effective_authority: case_authority_intersected_with_role_ceiling_runtime_capability_exact_targets_and_denials
  provider_default: disabled
  external_action_default: disabled
  self_approval: forbidden_for_high_risk_work

skill_packages:
  source: skills/*/SKILL.md
  distinction: listed_names_are_portable_packages_plain_capability_phrases_are_methods_only
  ids:
    - arcagcom
    - archflow-agent-control
    - archflow-architecture-operator
    - archflow-e1-runtime-guard
    - archflow-knowledge-service
    - archflow-task-breakdown
    - humanize-writing
    - outquestions
    - priority-task-operator
    - task-handout

agents:
  goal_and_architecture_operator:
    title: Goal and Architecture Operator
    lane: maker
    permission_mode: read_draft_only
    skill_packages: [archflow-architecture-operator]
    role_pack_ids: [definition_to_task_graph]
    handoff_to: independent_reviewer

  admission_controller:
    title: Admission Controller
    lane: controller
    permission_mode: read_draft_only
    skill_packages: [archflow-agent-control]
    role_pack_ids: [research_to_decision, definition_to_task_graph, responsive_product_change, reviewed_memory_update]
    handoff_to: action_validator

  source_and_context_operator:
    title: Source and Context Operator
    lane: maker
    permission_mode: read_draft_only
    skill_packages: [archflow-knowledge-service]
    role_pack_ids: [research_to_decision]
    handoff_to: independent_reviewer

  requirements_and_market_research:
    title: Requirements and Market Research
    lane: maker
    permission_mode: read_draft_only
    skill_packages: [archflow-knowledge-service]
    role_pack_ids: [research_to_decision]
    handoff_to: independent_reviewer

  onboarding_guide:
    title: Onboarding Guide
    lane: maker
    permission_mode: read_draft_only
    skill_packages: [archflow-knowledge-service]
    role_pack_ids: []
    handoff_to: action_validator

  task_and_handoff_planner:
    title: Task and Handoff Planner
    lane: maker
    permission_mode: read_draft_only
    skill_packages: [archflow-task-breakdown, priority-task-operator, task-handout]
    role_pack_ids: [definition_to_task_graph]
    handoff_to: action_validator

  positioning_and_copy_maker:
    title: Positioning and Copy Maker
    lane: maker
    permission_mode: read_draft_only
    skill_packages: [archflow-knowledge-service, humanize-writing]
    role_pack_ids: []
    handoff_to: independent_reviewer

  qualification_and_channel_planner:
