<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#061220"/>
  <rect x="20" y="20" width="1040" height="1310" fill="none" stroke="#263B49"/>
  <circle cx="990" cy="520" r="400" fill="none" stroke="#0B5B70"/>
  <circle cx="1000" cy="500" r="280" fill="none" stroke="#5B4A29"/>
  <circle cx="795" cy="1115" r="335" fill="none" stroke="#087284"/>

  <g font-family="Inter,Arial,sans-serif">
    <text x="84" y="98" fill="#30D8E7" font-size="15" font-weight="700" letter-spacing="1.8">VOICE OPERATIONS · 01</text>
    <text x="82" y="218" fill="#F0EDE4" font-size="78" font-weight="900">VOICE IS THE</text>
    <text x="82" y="307" fill="#30D8E7" font-size="84" font-weight="900">INTERFACE.</text>
    <text x="82" y="388" fill="#F0EDE4" font-size="75" font-weight="900">NOT THE MEMORY.</text>
    <text x="84" y="449" fill="#F0EDE4" font-size="24" font-weight="600">Hugging Face handles the live voice loop. ArchFlow must turn it into governed work data.</text>

    <rect x="84" y="525" width="912" height="495" rx="12" fill="#0D1117" stroke="#263B49" stroke-width="2"/>
    <rect x="84" y="525" width="912" height="42" rx="12" fill="#161B22"/>
    <circle cx="102" cy="546" r="5" fill="#FF5F57"/><circle cx="120" cy="546" r="5" fill="#FEBB2E"/><circle cx="138" cy="546" r="5" fill="#28C840"/>
    <rect x="158" y="534" width="525" height="25" rx="8" fill="#0D1117" stroke="#30363D"/>
    <text x="174" y="552" fill="#C9D1D9" font-size="13">github.com/huggingface/speech-to-speech</text>
    <rect x="84" y="567" width="912" height="38" fill="#010409"/>
    <rect x="98" y="575" width="28" height="23" rx="5" fill="#F0F6FC"/><text x="112" y="592" fill="#0D1117" font-size="10" text-anchor="middle" font-weight="900">GH</text>
    <text x="140" y="591" fill="#F0F6FC" font-size="13" font-weight="700">Product  Solutions  Open Source  Pricing</text>
    <text x="110" y="644" fill="#58A6FF" font-size="20">huggingface /</text>
    <text x="234" y="644" fill="#58A6FF" font-size="22" font-weight="800">speech-to-speech</text>
    <rect x="406" y="625" width="55" height="25" rx="12" fill="#21262D" stroke="#30363D"/><text x="433" y="642" fill="#8B949E" font-size="11" text-anchor="middle">Public</text>
    <text x="110" y="686" fill="#F0F6FC" font-size="13" font-weight="700">Code</text>
    <text x="165" y="686" fill="#8B949E" font-size="13">Issues</text><text x="220" y="686" fill="#8B949E" font-size="13">Pull requests</text><text x="325" y="686" fill="#8B949E" font-size="13">Actions</text><text x="390" y="686" fill="#8B949E" font-size="13">Projects</text><text x="455" y="686" fill="#8B949E" font-size="13">Security</text>
    <line x1="110" y1="695" x2="140" y2="695" stroke="#F78166" stroke-width="3"/>
    <rect x="110" y="716" width="636" height="260" rx="8" fill="#0D1117" stroke="#30363D"/>
    <rect x="110" y="716" width="636" height="38" fill="#161B22"/>
    <rect x="122" y="725" width="85" height="21" rx="5" fill="#238636"/><text x="165" y="740" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">main</text>
    <text x="130" y="808" fill="#F0F6FC" font-size="34" font-weight="900">Speech To Speech</text>
    <text x="130" y="838" fill="#C9D1D9" font-size="19" font-weight="700">Build voice agents with open-source models</text>
    <text x="130" y="873" fill="#C9D1D9" font-size="15">A low-latency, fully modular voice-agent pipeline exposed through an</text>
    <text x="130" y="894" fill="#C9D1D9" font-size="15">OpenAI Realtime-compatible API. Every component is swappable.</text>
    <g font-size="16" font-weight="900" text-anchor="middle">
      <rect x="130" y="925" width="105" height="36" rx="7" fill="#161B22" stroke="#30D8E7" stroke-width="2"/><text x="182" y="949" fill="#30D8E7">VAD</text>
      <text x="246" y="949" fill="#8B949E">→</text>
      <rect x="264" y="925" width="105" height="36" rx="7" fill="#161B22" stroke="#D4AA55" stroke-width="2"/><text x="316" y="949" fill="#D4AA55">STT</text>
      <text x="380" y="949" fill="#8B949E">→</text>
      <rect x="398" y="925" width="105" height="36" rx="7" fill="#161B22" stroke="#FE6F5E" stroke-width="2"/><text x="450" y="949" fill="#FE6F5E">LLM</text>
      <text x="514" y="949" fill="#8B949E">→</text>
      <rect x="532" y="925" width="105" height="36" rx="7" fill="#161B22" stroke="#68CFB2" stroke-width="2"/><text x="584" y="949" fill="#68CFB2">TTS</text>
    </g>
    <rect x="768" y="716" width="200" height="260" rx="8" fill="#0D1117" stroke="#30363D"/>
    <text x="790" y="755" fill="#F0F6FC" font-size="18" font-weight="800">About</text>
    <text x="790" y="787" fill="#C9D1D9" font-size="13">Build local voice agents with</text><text x="790" y="805" fill="#C9D1D9" font-size="13">open-source models.</text>
    <g font-size="11" fill="#58A6FF">
      <rect x="790" y="835" width="155" height="28" rx="14" fill="#13233A"/><text x="805" y="853">OpenAI Realtime</text>
      <rect x="790" y="870" width="155" height="28" rx="14" fill="#13233A"/><text x="805" y="888">WebSocket / WebRTC</text>
      <rect x="790" y="905" width="155" height="28" rx="14" fill="#13233A"/><text x="805" y="923">Python</text>
      <rect x="790" y="940" width="155" height="28" rx="14" fill="#13233A"/><text x="805" y="958">Apache 2.0</text>
    </g>
    <rect x="110" y="975" width="340" height="32" rx="16" fill="#061220" stroke="#30D8E7"/><text x="128" y="996" fill="#30D8E7" font-size="13" font-weight="700">GITHUB TOOL SNAPSHOT</text>

    <g>
      <line x1="84" y1="1055" x2="294" y2="1055" stroke="#30D8E7" stroke-width="3"/><text x="84" y="1086" fill="#30D8E7" font-size="13" font-weight="700">01</text><text x="84" y="1131" fill="#F0EDE4" font-size="23" font-weight="900">SPEAK</text><text x="84" y="1160" fill="#A6A9A7" font-size="15">60–90 sec: progress, blockers,</text><text x="84" y="1181" fill="#A6A9A7" font-size="15">next action</text>
      <line x1="316" y1="1055" x2="526" y2="1055" stroke="#D4AA55" stroke-width="3"/><text x="316" y="1086" fill="#D4AA55" font-size="13" font-weight="700">02</text><text x="316" y="1131" fill="#F0EDE4" font-size="23" font-weight="900">STRUCTURE</text><text x="316" y="1160" fill="#A6A9A7" font-size="15">Map the voice update to tasks</text><text x="316" y="1181" fill="#A6A9A7" font-size="15">and decisions</text>
      <line x1="548" y1="1055" x2="758" y2="1055" stroke="#FE6F5E" stroke-width="3"/><text x="548" y="1086" fill="#FE6F5E" font-size="13" font-weight="700">03</text><text x="548" y="1131" fill="#F0EDE4" font-size="23" font-weight="900">VERIFY</text><text x="548" y="1160" fill="#A6A9A7" font-size="15">Check sources, conflicts and</text><text x="548" y="1181" fill="#A6A9A7" font-size="15">write permissions</text>
      <line x1="780" y1="1055" x2="990" y2="1055" stroke="#68CFB2" stroke-width="3"/><text x="780" y="1086" fill="#68CFB2" font-size="13" font-weight="700">04</text><text x="780" y="1131" fill="#F0EDE4" font-size="23" font-weight="900">UPDATE</text><text x="780" y="1160" fill="#A6A9A7" font-size="15">Save the trace; surface</text><text x="780" y="1181" fill="#A6A9A7" font-size="15">exceptions for review</text>
    </g>

    <text x="84" y="1271" fill="#F0EDE4" font-size="16" font-weight="700">THE REPO GIVES YOU THE VOICE LOOP.</text>
    <text x="84" y="1300" fill="#D4AA55" font-size="17" font-weight="900">THE PRODUCT VALUE STARTS AFTER THE TRANSCRIPT.</text>
    <line x1="84" y1="1316" x2="996" y2="1316" stroke="#263B49"/>
    <text x="84" y="1337" fill="#F0EDE4" font-size="11" font-weight="700">ARCHFLOW / VOICE OPS</text>
    <text x="996" y="1337" fill="#F0EDE4" font-size="11" font-weight="700" text-anchor="end">ARCH-FLOW.DEV</text>
  </g>
</svg>
