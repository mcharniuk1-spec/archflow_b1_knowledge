version: "3.0"
status: active_public_core
purpose: >
  Admit only exact files named by the reviewed public corpus manifest into a
  source-linked context capsule. Retrieval is evidence selection, not authority.

approved_corpus:
  manifest: project/dashboard/corpus-manifest.json
  manifest_schema_version: "3.0"
  selection: manifest_entries_only
  unlisted_path_policy: reject

retrieval_rules:
  require_source_path: true
  require_repo_relative_path: true
  require_chunk_hash: true
  retrieval_is_read_only: true
  no_source_path_means_no_evidence: true
  provider_output_is_not_fact_without_review: true
  deterministic_lexical_default: true
  directory_expansion_forbidden: true

forbidden_inputs:
  - credentials_or_identity_values
  - local_absolute_paths
  - private_urls_or_private_source_text
  - raw_prompts_or_unreviewed_interaction_transcripts
  - account_or_deployment_identifiers
  - files_not_listed_in_the_manifest

review_gate:
  reviewer_role: independent_reviewer
  approve_if:
    - every_reference_is_manifest_listed_and_repo_relative
    - source_boundary_status_is_pass
    - factual_claims_have_evidence
    - unsupported_claims_are_zero
  block_if:
    - private_data_is_detected
    - context_is_missing_a_source_path_or_chunk_hash
    - provider_or_external_write_activation_is_inferred
